spring:
  application:
    name: chatbotq
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatbotq}
    username: ${DB_USERNAME:chatbotq}
    password: ${DB_PASSWORD:change-me-before-use}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  error:
    include-message: never
    include-stacktrace: never
