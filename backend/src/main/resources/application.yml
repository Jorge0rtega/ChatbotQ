spring:
  application:
    name: chatbotq
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatbotq}
    username: ${DB_USERNAME:chatbotq}
    password: ${DB_PASSWORD:change-me-before-use}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: 'timestamp=%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} level=%-5level correlation_id=%X{correlationId:-none} logger=%logger{36} message=%msg%n'

server:
  error:
    include-message: never
    include-stacktrace: never
