spring:
  application:
    name: chatbotq
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/chatbotq}
    username: ${DB_USERNAME:chatbotq}
    password: ${DB_PASSWORD:change-me-before-use}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    clean-disabled: true
    validate-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: 'timestamp=%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX} level=%-5level correlation_id=%X{correlationId:-none} logger=%logger{36} message=%msg%n'

server:
  error:
    include-message: never
    include-stacktrace: never

# JWT signing material is mandatory and must be supplied externally with at least 32 bytes of entropy.
# Access is limited to 5 minutes; rotating refresh families expire after 7 days (max accepted: 30 days).
chatbotq:
  security:
    bcrypt-strength: ${CHATBOTQ_BCRYPT_STRENGTH:12}
    jwt:
      secret: ${CHATBOTQ_JWT_SECRET}
      issuer: ${CHATBOTQ_JWT_ISSUER:chatbotq-local}
      access-ttl-seconds: ${CHATBOTQ_ACCESS_TTL_SECONDS:300}
      refresh-ttl-seconds: ${CHATBOTQ_REFRESH_TTL_SECONDS:604800}
