services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: chatbotq-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chatbotq}
      POSTGRES_USER: ${POSTGRES_USER:-chatbotq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - chatbotq-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  chatbotq-postgres-data:
